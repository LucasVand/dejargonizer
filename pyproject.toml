[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dejargonizer"
version = "0.1.0"
description = "Technical English to plain English simplification with T5."
requires-python = ">=3.10"
dependencies = [
  "datasets>=4,<5",
  "transformers>=4.40,<5",
  "accelerate>=0.26,<2",
  "sentencepiece>=0.2,<1",
  "sentence-transformers>=3,<6",
  "torch>=2.2",
  "httpx>=0.27,<1",
  "evaluate>=0.4,<1",
  "sacrebleu>=2.4,<3",
  "rouge-score>=0.1,<1",
  "textstat>=0.7,<1",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
dejargonizer-data = "dejargonizer.data:main"
dejargonizer-label = "dejargonizer.labeling:main"
dejargonizer-train = "dejargonizer.train:main"
dejargonizer-evaluate = "dejargonizer.evaluate:main"
dejargonizer-similarity = "dejargonizer.similarity:main"
dejargonizer-verify-pairs = "dejargonizer.verify_pairs:main"
dejargonizer = "dejargonizer.inference:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
